name: Kifu
options:
  bundleIdPrefix: com.kifu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  GoCore:
    path: Packages/GoCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"

targets:
  Kifu:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Kifu
      - path: Resources
        excludes:
          - "**/*.md"
    dependencies:
      - package: GoCore
        product: GoCore
    preBuildScripts:
      - name: Build offline KataGo engine (MPSGraph)
        script: "${SRCROOT}/Scripts/build-katago-ios.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(DERIVED_FILE_DIR)/KataGo/libkatago.a"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kifu.go
        DEVELOPMENT_TEAM: WY8GA8833U
        PRODUCT_NAME: Kifu
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Kifu/Kifu-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kifu
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LIBRARY_SEARCH_PATHS: "$(inherited) $(DERIVED_FILE_DIR)/KataGo"
        OTHER_LDFLAGS: "$(inherited) -lkatago -lz -lc++ -framework CoreML -framework Metal -framework MetalPerformanceShaders -framework MetalPerformanceShadersGraph"
        ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  Kifu:
    build:
      targets:
        Kifu: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
