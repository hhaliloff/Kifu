# Mobile profile for the bundled MPSGraph-only KataGo build.
logFile = /dev/null
logAllGTPCommunication = false
logSearchInfo = false
logSearchInfoForChosenMove = false
startupPrintMessageToStderr = false

rules = chinese
maxVisits = 160
allowResignation = false
resignThreshold = -0.90
ponderingEnabled = false
numSearchThreads = 2
nnMaxBatchSize = 1
nnCacheSizePowerOfTwo = 12
numNNServerThreadsPerModel = 1
metalDeviceToUseThread0 = 0
